<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💜 Flash Wash ⚡️</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f8;font-family:Tahoma,Arial;color:#222}.login{min-height:100vh;display:grid;place-items:center}.loginbox{background:#fff;padding:30px;border-radius:18px;width:min(400px,92%);box-shadow:0 8px 30px #0001}.loginbox h1{margin-top:0}.top{height:68px;background:#17132a;color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:800}.logo b{color:#bd63ff}.layout{display:flex;min-height:calc(100vh - 68px)}aside{width:220px;background:#211a37;padding:12px}aside button{width:100%;background:transparent;border:0;color:#ddd;padding:12px;border-radius:8px;text-align:right;margin:3px 0;cursor:pointer}aside button:hover,aside button.active{background:#7c3aed;color:#fff}.content{flex:1;padding:24px;max-width:1450px}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 12px #0000000a}.big{font-size:25px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px}.btn{background:#7c3aed;color:#fff;border:0;padding:11px 17px;border-radius:8px;cursor:pointer}.btn.gray{background:#555}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:right}.muted{color:#777;font-size:13px}.error{color:#b00020;margin-top:10px}@media(max-width:900px){aside{width:65px}aside span{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.content{padding:12px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>💜 Flash Wash ⚡️</h1><p>تسجيل الدخول للنظام</p><div class="field"><label>اسم المستخدم</label><input id="lu" value=""></div><br><div class="field"><label>كلمة المرور</label><input id="lp" type="password"></div><br><button class="btn" style="width:100%" onclick="login()">دخول</button><div id="le" class="error"></div><p class="muted">نسخة الإدارة V3</p></div></div>
<div id="app" style="display:none"><header class="top"><div class="logo">💜 Flash Wash <b>⚡️</b></div><div><span id="who"></span> &nbsp; <button class="btn gray" onclick="logout()">خروج</button></div></header><div class="layout"><aside>
<button class="active" onclick="go('home',this)">🏠 <span>الرئيسية</span></button><button onclick="go('new',this)">➕ <span>إضافة طلب</span></button><button onclick="go('orders',this)">🚗 <span>الطلبات</span></button><button onclick="go('customers',this)">👥 <span>العملاء</span></button><button onclick="go('subs',this)">📅 <span>الاشتراكات</span></button><button onclick="go('expenses',this)">💰 <span>المصروفات</span></button><button onclick="go('reports',this)">📊 <span>التقارير</span></button><button id="auditNav" onclick="go('audit',this)">🧾 <span>سجل الحركات</span></button><button id="usersNav" onclick="go('users',this)">🔐 <span>المستخدمون</span></button><button id="backupNav" onclick="backup()">💾 <span>نسخة احتياطية</span></button>
</aside><main class="content">
<section id="home" class="page active"><div class="head"><h2>لوحة التحكم</h2><button class="btn" onclick="loadHome()">تحديث</button></div><div class="cards"><div class="card">طلبات اليوم<div class="big" id="ho">0</div></div><div class="card">الإيراد<div class="big" id="hr">0</div></div><div class="card">المصروف<div class="big" id="he">0</div></div><div class="card">الصافي<div class="big" id="hn">0</div></div><div class="card">اشتراكات فعالة<div class="big" id="hs">0</div></div></div></section>
<section id="new" class="page"><h2>إضافة طلب</h2><div class="card"><div class="grid"><div class="field"><label>اسم العميل</label><input id="cn"></div><div class="field"><label>الهاتف</label><input id="cp"></div><div class="field"><label>المنطقة</label><input id="ca"></div><div class="field"><label>السيارة</label><select id="ct"><option>ناصية</option><option>عالية</option></select></div><div class="field"><label>الخدمة</label><select id="cs"><option>عادي</option><option>VIP</option><option>حمام</option><option>بوليش</option></select></div><div class="field"><label>الكابتن</label><select id="ce"></select></div><div class="field"><label>الوقت</label><select id="capp"><option>12:00</option><option>14:00</option><option>16:00</option><option>18:00</option><option>20:00</option></select></div><div class="field"><label>السعر</label><input id="cprice" type="number"></div><div class="field"><label>ملاحظات</label><textarea id="cnotes"></textarea></div></div><br><button class="btn" onclick="saveOrder()">حفظ الطلب</button></div></section>
<section id="orders" class="page"><div class="head"><h2>الطلبات</h2><button class="btn" onclick="loadOrders()">تحديث</button></div><div id="ordersBox"></div></section>
<section id="customers" class="page"><div class="head"><h2>العملاء</h2><button class="btn" onclick="loadCustomers()">تحديث</button></div><div id="customersBox"></div></section>
<section id="subs" class="page"><h2>الاشتراكات الشهرية</h2><div class="card"><div class="grid"><div class="field"><label>العميل</label><input id="sn"></div><div class="field"><label>الهاتف</label><input id="sp"></div><div class="field"><label>الباقة</label><select id="spl"><option value="58000">ناصية — 58,000</option><option value="69000">عالية — 69,000</option><option value="78000">VIP — 78,000</option></select></div><div class="field"><label>اليوم</label><input id="sday" placeholder="مثال الخميس"></div><div class="field"><label>الوقت</label><input id="stime" placeholder="18:00"></div><div class="field"><label>البداية</label><input id="ss" type="date"></div><div class="field"><label>النهاية</label><input id="se" type="date"></div></div><br><button class="btn" onclick="saveSub()">حفظ الاشتراك</button></div><br><div id="subsBox"></div></section>
<section id="expenses" class="page"><h2>المصروفات</h2><div class="card"><div class="grid"><div class="field"><label>البند</label><input id="et"></div><div class="field"><label>التصنيف</label><select id="ec"><option>رواتب</option><option>مواد</option><option>بانزين</option><option>تسويق</option><option>صيانة</option><option>أخرى</option></select></div><div class="field"><label>المبلغ</label><input id="ea" type="number"></div><div class="field"><label>التاريخ</label><input id="ed" type="date"></div></div><br><button class="btn" onclick="saveExpense()">حفظ</button></div><br><div id="expBox"></div></section>
<section id="reports" class="page"><h2>التقارير</h2><div id="repBox"></div></section>
<section id="audit" class="page"><h2>سجل الحركات</h2><div id="auditBox"></div></section>
<section id="users" class="page"><h2>المستخدمون والصلاحيات</h2><div class="card"><div class="grid"><div class="field"><label>اسم المستخدم</label><input id="un"></div><div class="field"><label>كلمة المرور</label><input id="up" type="password"></div><div class="field"><label>الصلاحية</label><select id="ur"><option value="worker">كابتن</option><option value="admin">مدير</option></select></div></div><br><button class="btn" onclick="addUser()">إضافة مستخدم</button></div><br><div id="usersBox"></div></section>
</main></div></div>
<script>
const $=x=>document.getElementById(x),money=n=>(Number(n)||0).toLocaleString('ar-IQ')+' د.ع';let token=localStorage.flashToken,user=null;
async function api(u,o={}){o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{},token?{Authorization:'Bearer '+token}:{});let r=await fetch(u,o);let x=await r.json();if(r.status===401){logout();throw Error(x.error)}if(!r.ok)throw Error(x.error||'خطأ');return x}
async function login(){try{let x=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('lu').value,password:$('lp').value})});token=x.token;localStorage.flashToken=token;user=x.user;enter()}catch(e){$('le').textContent=e.message}}
async function enter(){try{user=await api('/api/me');$('login').style.display='none';$('app').style.display='block';$('who').textContent=user.username+' — '+(user.role==='admin'?'مدير':'مستخدم');if(user.role!=='admin'){['auditNav','usersNav','backupNav'].forEach(id=>$(id).style.display='none')}loadHome();loadEmployees()}catch(e){logout()}}
function logout(){localStorage.removeItem('flashToken');token=null;location.reload()}
function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('aside button').forEach(x=>x.classList.remove('active'));b.classList.add('active');({home:loadHome,new:loadEmployees,orders:loadOrders,customers:loadCustomers,subs:loadSubs,expenses:loadExpenses,reports:loadReports,audit:loadAudit,users:loadUsers}[id]||(()=>{}))()}
async function loadHome(){let x=await api('/api/dashboard');$('ho').textContent=x.orders;$('hr').textContent=money(x.revenue);$('he').textContent=money(x.expenses);$('hn').textContent=money(x.net);$('hs').textContent=x.subscriptions}
async function loadEmployees(){let x=await api('/api/employees');$('ce').innerHTML=x.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');setPrice()}
function setPrice(){let s=$('cs').value,c=$('ct').value;$('cprice').value=s==='عادي'?(c==='ناصية'?15000:18000):s==='VIP'?20000:0}
$('cs').onchange=setPrice;$('ct').onchange=setPrice;
async function saveOrder(){await api('/api/orders',{method:'POST',body:JSON.stringify({customer_name:$('cn').value,phone:$('cp').value,area:$('ca').value,car_type:$('ct').value,service:$('cs').value,employee_id:$('ce').value,appointment:$('capp').value,price:Number($('cprice').value),notes:$('cnotes').value})});alert('تم حفظ الطلب');loadHome()}
async function loadOrders(){let x=await api('/api/orders');$('ordersBox').innerHTML=tbl(x,['id','customer_name','phone','area','service','employee','appointment','price','status'])}
async function loadCustomers(){let x=await api('/api/customers');$('customersBox').innerHTML=tbl(x,['phone','customer_name','area','washes','total_paid','last_wash'])}
async function saveSub(){await api('/api/subscriptions',{method:'POST',body:JSON.stringify({customer_name:$('sn').value,phone:$('sp').value,plan:$('spl').options[$('spl').selectedIndex].text,price:Number($('spl').value),start_date:$('ss').value,end_date:$('se').value,day:$('sday').value,time:$('stime').value})});alert('تم الحفظ');loadSubs()}
async function loadSubs(){let x=await api('/api/subscriptions');$('subsBox').innerHTML=tbl(x,['id','customer_name','phone','plan','price','washes_total','washes_used','start_date','end_date','day','time'])}
async function saveExpense(){await api('/api/expenses',{method:'POST',body:JSON.stringify({title:$('et').value,category:$('ec').value,amount:Number($('ea').value),date:$('ed').value})});alert('تم الحفظ');loadExpenses()}
async function loadExpenses(){let x=await api('/api/expenses');$('expBox').innerHTML=tbl(x,['id','title','category','amount','date'])}
async function loadReports(){let x=await api('/api/reports');$('repBox').innerHTML='<h3>حسب الكابتن</h3>'+tbl(x.byEmp,['employee','orders','revenue'])+'<h3>حسب الخدمة</h3>'+tbl(x.byService,['service','orders','revenue'])}
async function loadAudit(){let x=await api('/api/audit');$('auditBox').innerHTML=tbl(x,['id','username','action','entity','entity_id','details','created_at'])}
async function loadUsers(){let x=await api('/api/users');$('usersBox').innerHTML=tbl(x,['id','username','role','active'])}
async function addUser(){await api('/api/users',{method:'POST',body:JSON.stringify({username:$('un').value,password:$('up').value,role:$('ur').value})});alert('تم إنشاء المستخدم');loadUsers()}
function tbl(a,c){if(!a.length)return '<div class="card">لا توجد بيانات</div>';return '<table class="table"><tr>'+c.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+a.map(r=>'<tr>'+c.map(x=>`<td>${x==='price'||x==='amount'||x==='revenue'||x==='total_paid'?money(r[x]):(r[x]??'')}</td>`).join('')+'</tr>').join('')+'</table>'}
async function backup(){let x=await api('/api/backup');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download='flash-wash-backup.json';a.click()}
if(token)enter();
</script></body></html>
